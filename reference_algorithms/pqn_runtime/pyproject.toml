[project]
name = "pqn-reference-runtime"
version = "0.1.0"
description = "Isolated CPU runtime for the unchanged upstream PQN benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jax==0.4.38",
  "jaxlib==0.4.38",
  "flax==0.10.2",
  "optax==0.2.4",
  "chex==0.1.88",
  "gymnax==0.0.6",
  "orbax-checkpoint==0.10.3",
  "numpy==1.26.4",
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "safetensors>=0.4,<1",
  "wandb>=0.19,<1",
  "six>=1.16,<2",
]

[tool.uv]
required-version = "==0.12.11"
