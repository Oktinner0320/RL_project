[project]
name = "cloud-edge-reference-benchmarks"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.10,<4",
  "rtdl-num-embeddings==0.0.12",
  "psutil>=7,<8",
  "cvxpy>=1.7,<2",
  "statsmodels>=0.14,<0.15",
  "tqdm>=4.67,<5",
  "optuna>=4,<5",
  "pydantic>=2,<3",
  "pytorch-ignite>=0.5,<0.6",
  "torchmetrics>=1.8,<2",
  "seaborn>=0.13,<0.14",
  "tabulate>=0.9,<1",
  "jinja2>=3,<4",
]

[tool.uv]
required-version = "==0.12.11"
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
