[project]
name = "cloud-edge-rl"
version = "0.1.0"
description = "Notebook-controlled framework for risk-aware federated RL research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0",
  "gymnasium==1.3.0",
  "modal==1.6.0",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
comparisons = [
  "rtdl-num-embeddings==0.0.12",
  "torchvision==0.26.0",
  "psutil>=7,<8",
  "cvxpy>=1.7,<2",
  "statsmodels>=0.14,<0.15",
  "tqdm>=4.67,<5",
  "optuna>=4,<5",
  "pydantic>=2,<3",
  "pytorch-ignite>=0.5,<0.6",
  "torchmetrics>=1.8,<2",
  "seaborn>=0.13,<0.14",
  "tabulate>=0.9,<1",
  "jinja2>=3,<4",
]

[dependency-groups]
dev = ["jupyterlab>=4.4,<5", "ipykernel>=6.29,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "pytest>=8,<10", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_edge_rl"]

[tool.uv]
required-version = "==0.12.11"
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference_algorithms/repos"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
